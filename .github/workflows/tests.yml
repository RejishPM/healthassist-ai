name: Tests
on:
  pull_request:
  push:
    branches: [main, fix/rag-foundation-20261014]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - run: python -m unittest discover -s tests -v
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: healthassist
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: healthassist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthassist -d healthassist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HEALTHASSIST_TEST_DATABASE_URL: postgresql://healthassist:test-only-password@localhost:5432/healthassist_test
      DATABASE_URL: postgresql://healthassist:test-only-password@localhost:5432/healthassist_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - run: python -m unittest tests.test_database_integration -v
      - name: Initialize disposable demo database
        run: python -m scripts.init_db
      - name: Verify HTTP demo with a mocked Ollama provider
        run: python -m scripts.demo --mock-ollama
